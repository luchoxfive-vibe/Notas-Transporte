<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Transportador">
<title>Transportador</title>
<style>
:root{--bg:#0b0d12;--p:#151922;--p2:#1f2531;--t:#f4f6fa;--m:#8b94a7;--a:#ffb020;--ac:#1a1200;--bd:#2c3342}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;background:var(--p2);border:2px solid var(--bd);border-radius:14px;cursor:pointer;font-weight:700;padding:0}
button:active{transform:scale(.97)}
button.on{background:var(--a);color:var(--ac);border-color:var(--a)}
#app{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));padding-top:calc(10px + env(safe-area-inset-top));max-width:900px;margin:0 auto}
.bar{display:flex;gap:8px;justify-content:space-between;flex:none}
.seg{display:flex;gap:6px}
.seg button{min-height:44px;font-size:.95rem;padding:0 14px;border-radius:10px;white-space:nowrap}
.banner{flex:none;display:flex;align-items:center;gap:8px;text-align:center;background:var(--p);border:1px solid var(--bd);border-radius:20px;padding:12px 8px}
#banner{flex:1;min-width:0}
.pm{flex:none;width:clamp(64px,19vw,92px);height:clamp(72px,12dvh,100px);font-size:2.8rem;line-height:1;color:var(--a);border-color:var(--a)}
.route{display:flex;align-items:center;justify-content:center;gap:16px;font-size:clamp(2.6rem,12vw,5rem);font-weight:800;line-height:1}
.route i{color:var(--m);font-style:normal;font-size:.55em}
.route .old{color:#6ea8ff}
.route .new{color:var(--a)}
.semi{margin-top:8px;font-size:1.25rem;color:var(--m)}
.semi b{color:var(--t);font-size:1.3em}
.panels{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:18px;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 8%,var(--bg))}
.panel.orig{--pc:#6ea8ff}
.panel.nuevo{--pc:var(--a)}
.panel h2{margin:0;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--pc);flex:none}
.panel .key.on{background:var(--pc);border-color:var(--pc);color:#0b0d12}
.keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:6px}
.key{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:clamp(1.3rem,6vw,1.9rem);padding:0 2px}
.key small{font-size:.55em;opacity:.75;font-weight:600}
.key.blk{background:color-mix(in srgb,var(--p2) 70%,#000)}
.key.blk.on{background:var(--a)}
@media (orientation:landscape) and (min-width:640px){
  .panels{flex-direction:row}
  .keys{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr)}
  .route{font-size:clamp(2.4rem,9vh,4rem)}
}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="seg" id="minorSeg"></div>
    <div class="seg" id="notaSeg"></div>
  </div>
  <div class="banner"><button class="pm" data-a="step" data-v="-1" aria-label="Bajar medio tono">−</button><div id="banner"></div><button class="pm" data-a="step" data-v="1" aria-label="Subir medio tono">+</button></div>
  <div class="panels">
    <div class="panel orig"><h2>Tono original</h2><div class="keys" id="fromGrid"></div></div>
    <div class="panel nuevo"><h2>Tono nuevo</h2><div class="keys" id="toGrid"></div></div>
  </div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const KEY='transportador.simple.v1';
const S=Object.assign({from:0,to:2,minor:false,nota:'en'},(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}})());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const NAMES={
  en:[['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B']],
  la:[['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'],['Do','Reb','Re','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si']]
};
const nm=(pc,flat)=>NAMES[S.nota][flat?1:0][pc%12];
const pretty=s=>s.replace('#','♯').replace(/b$/,'♭');
const BLACK=[1,3,6,8,10];
const useFlats=(pc,minor)=>[5,10,3,8,1,6].includes(minor?(pc+3)%12:pc);
const keyName=pc=>pretty(nm(pc,useFlats(pc,S.minor)))+(S.minor?'m':'');

const seg=(act,cur,items)=>items.map(([v,l])=>`<button class="${String(cur)===String(v)?'on':''}" data-a="${act}" data-v="${v}">${l}</button>`).join('');
function keys(cur,act){
  return [...Array(12)].map((_,pc)=>{
    const b=BLACK.includes(pc), m=S.minor?'m':'';
    const lbl=b?`${pretty(nm(pc,false))}${m}<small>${pretty(nm(pc,true))}${m}</small>`:pretty(nm(pc,false))+m;
    return `<button class="key ${b?'blk':''} ${pc===cur?'on':''}" data-a="${act}" data-v="${pc}">${lbl}</button>`;
  }).join('');
}
function render(){
  $('#minorSeg').innerHTML=seg('minor',S.minor?1:0,[[0,'Mayor'],[1,'menor']]);
  $('#notaSeg').innerHTML=seg('nota',S.nota,[['en','C D E'],['la','Do Re Mi']]);
  $('#fromGrid').innerHTML=keys(S.from,'from');
  $('#toGrid').innerHTML=keys(S.to,'to');
  const up=(S.to-S.from+12)%12;
  const txt=up===0?'Mismo tono':up<=6
    ?`Subir <b>${up}</b> ${up===1?'semitono':'semitonos'} ▲`
    :`Bajar <b>${12-up}</b> ${12-up===1?'semitono':'semitonos'} ▼`;
  $('#banner').innerHTML=`<div class="route"><span class="old">${keyName(S.from)}</span><i>→</i><span class="new">${keyName(S.to)}</span></div><div class="semi">${txt}</div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b)return;
  const v=b.dataset.v, a=b.dataset.a;
  if(a==='from')S.from=+v; else if(a==='to')S.to=+v;
  else if(a==='step')S.to=(S.to+(+v)+12)%12; else if(a==='minor')S.minor=v==='1'; else if(a==='nota')S.nota=v;
  save(); render();
});
render();
</script>
</body>
</html>
